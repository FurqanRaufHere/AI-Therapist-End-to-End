services:
  - type: web
    name: AI-Therapist
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: gunicorn api_server:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
